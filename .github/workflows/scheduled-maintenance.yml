name: Zamanlanmış bakım (kur + yedek)

# Vercel Hobby planında cron en fazla günde 1 kez çalışır (vercel.json).
# Bu iş, admin paneline girilmese ve uygulamada trafik olmasa da kur güncellemesini
# ve otomatik yedeği admin panelinde belirlenen aralıklarla tetikler. Uç noktalar
# aralık dolmadıysa hiçbir şey yapmaz, bu yüzden sık çağrılması güvenlidir.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-maintenance
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      APP_URL: ${{ vars.APP_URL || 'https://azfur-sms.vercel.app' }}
    steps:
      - name: TCMB kur güncelleme
        run: |
          curl -sS --fail-with-body --max-time 60 --retry 2 --retry-delay 10 "$APP_URL/api/cron/rate"
          echo
      - name: Otomatik sistem yedeği
        if: always()
        run: |
          curl -sS --fail-with-body --max-time 60 --retry 2 --retry-delay 10 "$APP_URL/api/cron/backup"
          echo
